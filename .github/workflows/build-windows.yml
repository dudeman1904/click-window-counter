name: Build Windows mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          configure-args: -S click-windows

      - name: Upload the built mod
        uses: actions/upload-artifact@v7
        with:
          name: Windows mod (.geode)
          path: ${{ steps.build.outputs.build-output }}/*.geode
